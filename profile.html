<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Profile</title>

    <link rel="stylesheet" href="profile.css" />

    <link rel="stylesheet" href="utils.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />
    <link rel="icon" type="image/png" href="favicon.png">

<link
  rel="apple-touch-icon"
  href="icon-192.png"
/>

<link
  rel="manifest"
  href="manifest.json"
/>

<meta name="theme-color" content="#ffc107">
  </head>

  <body>
    <!-- =========================================
     FAST MTN CUSTOM ALERT
========================================= -->

    <div id="alertBox" class="alert-box"></div>

    <div class="app">
      <!-- =====================================
           HEADER
      ====================================== -->

      <div class="header">
        <a href="dashboard.html" class="back">
          <i class="fa-solid fa-arrow-left"></i>
        </a>

        <!-- USER -->
        <div class="user">
          <div class="avatar">
            <!-- PROFILE IMAGE -->

            <img id="profileImage" src="avatar.png" alt="Profile" />

            <!-- IMAGE INPUT -->

            <input type="file" id="imageInput" accept="image/*" hidden />

            <!-- CAMERA BUTTON -->

            <label
              for="imageInput"
              class="camera-btn"
              title="Change profile picture"
            >
              <i class="fa-solid fa-camera"></i>
            </label>
          </div>

          <!-- USER INFORMATION -->

          <div class="info">
            <h2 id="name"></h2>

            <p id="phone"></p>
          </div>
        </div>
      </div>

      <!-- =====================================
           PROFILE IMAGE FULL-SCREEN VIEWER
      ====================================== -->

      <div id="imageViewer" class="image-viewer" aria-hidden="true">
        <!-- CLOSE BUTTON -->

        <button
          type="button"
          id="closeImageViewer"
          class="close-image-viewer"
          aria-label="Close image"
        >
          <i class="fa-solid fa-xmark"></i>
        </button>

        <!-- FULL IMAGE -->

        <img id="fullProfileImage" src="" alt="Profile Picture" />
      </div>

      <!-- =====================================
           MENU
      ====================================== -->

      <div class="menu">
        <!-- EDIT PROFILE -->

        <a href="edit-profile.html" class="item">
          <div>
            <i class="fa-solid fa-user-pen"></i>

            <span>Edit Profile</span>
          </div>

          <i class="fa-solid fa-chevron-right"></i>
        </a>

        <!-- CHANGE PASSWORD -->

        <a href="change-password.html" class="item">
          <div>
            <i class="fa-solid fa-lock"></i>

            <span>Change Password</span>
          </div>

          <i class="fa-solid fa-chevron-right"></i>
        </a>

        <!-- SECURITY -->

        <a href="security.html" class="item">
          <div>
            <i class="fa-solid fa-shield-halved"></i>

            <span>Security</span>
          </div>

          <i class="fa-solid fa-chevron-right"></i>
        </a>

        <!-- NOTIFICATION SETTINGS -->

        <a href="notifications-setting.html" class="item">
          <div>
            <i class="fa-solid fa-bell"></i>

            <span>Notification Settings</span>
          </div>

          <i class="fa-solid fa-chevron-right"></i>
        </a>

        <!-- HELP -->

        <a href="help-support.html" class="item">
          <div>
            <i class="fa-regular fa-circle-question"></i>

            <span>Help & Support</span>
          </div>

          <i class="fa-solid fa-chevron-right"></i>
        </a>

        <!-- ABOUT -->

        <a href="about.html" class="item">
          <div>
            <i class="fa-solid fa-circle-info"></i>

            <span>About Us</span>
          </div>

          <i class="fa-solid fa-chevron-right"></i>
        </a>

        <!-- LOGOUT -->

        <a href="#" id="logoutBtn" class="item logout">
          <div>
            <i class="fa-solid fa-right-from-bracket"></i>

            <span>Logout</span>
          </div>
        </a>
      </div>
    </div>

    <!-- =====================================
         SCRIPTS
    ====================================== -->

    <script src="utils.js"></script>
    <script src="profile.js"></script>
  </body>
</html>
