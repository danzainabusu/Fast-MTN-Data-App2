    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />

    <link rel="stylesheet" href="css/help-support.css" />

    <link rel="stylesheet" href="css/utils.css" />

    <link rel="icon" type="image/png" href="logo.png" />

    <link rel="icon" type="image/png" sizes="192x192" href="logo.png" />

  <body>
    <!-- =====================================
         HEADER
    ====================================== -->

    <header class="header">
      <a href="profile.html" class="back-btn" aria-label="Go back">
        <i class="fa-solid fa-arrow-left"></i>
      </a>

      <h1>Help & Support</h1>
    </header>

    <!-- =====================================
         SUPPORT OPTIONS
    ====================================== -->

    <main class="support-list">
      <!-- =====================================
           WHATSAPP
      ====================================== -->

      <a
        href="https://wa.me/2348140902312?text=Hello%20Fast%20MTN%20Support%2C%20I%20need%20help%20with%20my%20account."
        class="support-card"
      >
        <div class="support-left">
          <div class="support-icon whatsapp-icon">
            <i class="fa-brands fa-whatsapp"></i>
          </div>

          <div class="support-text">
            <h3>WhatsApp Support</h3>

            <p>Chat with our support team</p>
          </div>
        </div>

        <i class="fa-solid fa-chevron-right support-arrow"></i>
      </a>

      <!-- =====================================
           EMAIL
      ====================================== -->

      <a
        href="mailto:support@fastmtn.com?subject=Fast%20MTN%20Support%20Request"
        class="support-card"
      >
        <div class="support-left">
          <div class="support-icon">
            <i class="fa-solid fa-envelope"></i>
          </div>

          <div class="support-text">
            <h3>Email Support</h3>

            <p>support@fastmtn.com</p>
          </div>
        </div>

        <i class="fa-solid fa-chevron-right support-arrow"></i>
      </a>

      <!-- =====================================
           CALL
      ====================================== -->

      <a href="tel:+2348140902312" class="support-card">
        <div class="support-left">
          <div class="support-icon">
            <i class="fa-solid fa-phone"></i>
          </div>

          <div class="support-text">
            <h3>Call Support</h3>

            <p>08140902312</p>
          </div>
        </div>

        <i class="fa-solid fa-chevron-right support-arrow"></i>
      </a>

      <!-- =====================================
           REPORT PROBLEM
      ====================================== -->

      <a href="report-problem.html" class="support-card">
        <div class="support-left">
          <div class="support-icon">
            <i class="fa-solid fa-bug"></i>
          </div>

          <div class="support-text">
            <h3>Report a Problem</h3>

            <p>Send us your complaint</p>
          </div>
        </div>

        <i class="fa-solid fa-chevron-right support-arrow"></i>
      </a>

      <!-- =====================================
           FAQ
      ====================================== -->

      <a href="faq.html" class="support-card">
        <div class="support-left">
          <div class="support-icon">
            <i class="fa-solid fa-circle-question"></i>
          </div>

          <div class="support-text">
            <h3>Frequently Asked Questions</h3>

            <p>Find answers quickly</p>
          </div>
        </div>

        <i class="fa-solid fa-chevron-right support-arrow"></i>
      </a>

    <!-- =====================================
         JAVASCRIPT
    ====================================== -->

    <script src="js/utils.js"></script>
