<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Request Submitted</title>

    <link rel="stylesheet" href="airtime-cash-success.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />

    <link rel="icon" type="image/png" href="logo.png" />

    <link rel="icon" type="image/png" sizes="192x192" href="logo.png" />

    <link rel="icon" type="image/png" sizes="512x512" href="logo.png" />

    <link rel="apple-touch-icon" href="logo.png" />

    <link rel="manifest" href="manifest.json" />

    <meta name="theme-color" content="#ffc107" />
  </head>

  <body>
    <div class="top">
      <div class="check">
        <i class="fa-solid fa-check"></i>
      </div>
    </div>

    <div class="content">
      <h1>Request Submitted</h1>

      <p>Your Airtime to Cash request has been submitted successfully.</p>

      <div class="card">
        <div class="row">
          <span>Network</span>

          <strong id="network"></strong>
        </div>

        <div class="row">
          <span>Amount</span>

          <strong id="amount"></strong>
        </div>

        <div class="row">
          <span>Status</span>

          <strong class="pending"> Pending Approval </strong>
        </div>

        <div class="row">
          <span>Date</span>

          <strong id="date"></strong>
        </div>
      </div>

      <button id="sellMore">Sell More Airtime</button>

      <button id="viewDetail" class="outline">View detail</button>
    </div>

    <script src="airtime-cash-success.js"></script>
  </body>
</html>
