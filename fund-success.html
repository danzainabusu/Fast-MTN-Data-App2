<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Funding Request</title>

    <link rel="stylesheet" href="css/fund-success.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />

    <link rel="icon" type="image/png" href="logo.png" />

    <link rel="icon" type="image/png" sizes="192x192" href="logo.png" />

    <link rel="icon" type="image/png" sizes="512x512" href="logo.png" />

    <link rel="apple-touch-icon" href="logo.png" />

    <link rel="manifest" href="manifest.json" />

    <meta name="theme-color" content="#ffc107" />
  </head>

  <body>
    <div class="success-header">
      <div class="check-circle">
        <i class="fa-solid fa-check"></i>
      </div>
    </div>

    <div class="content">
      <h1>Request Submitted!</h1>

      <p>Your wallet funding request has been submitted successfully.</p>

      <h2 id="amount"></h2>

      <div class="details">
        <div class="row">
          <span>Amount</span>
          <strong id="detailAmount"></strong>
        </div>

        <div class="row">
          <span>Payment Method</span>
          <strong id="method"></strong>
        </div>

        <div class="row">
          <span>Reference</span>
          <strong id="reference"></strong>
        </div>

        <div class="row">
          <span>Status</span>
          <strong class="pending">Pending Approval</strong>
        </div>

        <div class="row">
          <span>Date</span>
          <strong id="date"></strong>
        </div>
      </div>

      <button id="walletBtn">Go to Wallet</button>

      <button id="historyBtn" class="outline">View Detail</button>
    </div>

    <script src="js/fund-success.js"></script>
  </body>
</html>
