<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Fund Wallet</title>

    <link rel="css/stylesheet" href="wallet.css" />
    <link rel="stylesheet" href="utils.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />
    <link rel="icon" type="image/png" href="favicon.png">

<link
  rel="apple-touch-icon"
  href="icon-192.png"
/>

<link
  rel="manifest"
  href="manifest.json"
/>

<meta name="theme-color" content="#ffc107">
  </head>

  <body>
    <div class="app">
      <div class="header">
        <a href="wallet.html">
          <i class="fa-solid fa-arrow-left"></i>
        </a>

        <h2>Fund Wallet</h2>
      </div>

      <div class="fund-card">
        <label>Amount (₦)</label>

        <input type="number" id="amount" placeholder="Enter amount" />

        <label>Payment Method</label>

        <select id="method">
          <option value="bank">Bank Transfer</option>
          <option value="opay">OPay</option>
          <option value="palmpay">PalmPay</option>
        </select>

        <div id="bankDetails" class="bank-details">
          <h3>Payment Details</h3>

          <div class="bank-row">
            <span>Provider</span>
            <strong id="providerName">Moniepoint MFB</strong>
          </div>

          <div class="bank-row">
            <span>Account Name</span>
            <strong id="accountName">FAST MTN DATA</strong>
          </div>

          <div class="bank-row">
            <span>Account Number</span>

            <div class="copy-box">
              <strong id="accountNumber"> 1234567890 </strong>

              <button type="button" id="copyBtn">
                <i class="fa-regular fa-copy"></i>
              </button>
            </div>
          </div>
        </div>

        <button id="submitFund">Submit Request</button>
      </div>
    </div>

    <script src="utils.js"></script>
    <script src="fund-wallet.js"></script>
  </body>
</html>
