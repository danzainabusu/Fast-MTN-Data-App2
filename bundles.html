<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Data Bundles</title>

    <link rel="stylesheet" href="css/bundles.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="stylesheet" href="css/utils.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />

    <link rel="icon" type="image/png" href="logo.png" />

    <link rel="icon" type="image/png" sizes="192x192" href="logo.png" />

    <link rel="icon" type="image/png" sizes="512x512" href="logo.png" />

    <link rel="apple-touch-icon" href="logo.png" />

    <link rel="manifest" href="manifest.json" />

    <meta name="theme-color" content="#ffc107" />
  </head>
  <body>
    <div id="pageLoader">
      <div class="loaderWrapper">
        <!-- Rotating border -->
        <div class="loaderBorder"></div>

        <!-- Logo stays still -->
        <img src="logo.png" alt="Fast MTN" class="loaderLogo" />
      </div>
    </div>

    <div class="phone">
      <div class="top">
        <a href="dashboard.html">
          <i class="fa-solid fa-arrow-left"></i>
        </a>

        <h2>Data Bundles</h2>

        <div></div>
      </div>

      <div class="tabs">
        <button class="tab active" onclick="showPlans('daily')">Daily</button>

        <button class="tab" onclick="showPlans('weekly')">Weekly</button>

        <button class="tab" onclick="showPlans('monthly')">Monthly</button>
      </div>

      <div id="plansContainer"></div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/bundles.js"></script>
    <script src="js/page-loader.js"></script>
  </body>
</html>
